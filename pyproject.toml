[tool.poetry]
name = "embuddy"
version = "0.2.0"
description = "embuddy is a package helps with using text embeddings for local data analysis."
authors = ["Peter Baumgartner"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.14,<3.15"
sentence-transformers = "^6.1.0"
zarr = "^3.4.1"
pynndescent = ">=0.6.0, <1.0"
joblib = "^1.6.0"
joblib-zstd = ">=0.1.1, <0.2"
numba = ">=0.68.0, <1.0"
umap-learn = ">=0.5.12, <1.0"
numpy = "^2.5.4"

[tool.poetry.group.dev.dependencies]
pytest = ">=9,<10"
ipython = ">=9"
black = ">=26"
isort = ">=7"
mypy = ">=1.19"
flake8 = ">=7"
pytest-cov = ">=7"
pytest-sugar = ">=1"
Faker = ">=40"
mkdocs = ">=1.6"
mkdocs-material = ">=9"
mkdocstrings = {extras = ["python"], version = ">=1"}
pandas = ">=3"
Pygments = ">=2.19"
pymdown-extensions = ">=10"
Jinja2 = ">=3.1.6"

[build-system]
requires = ["poetry-core>=2.2"]
build-backend = "poetry.core.masonry.api"
