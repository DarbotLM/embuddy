<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="EmBuddy logo">
  <defs>
    <linearGradient id="embuddyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="44" height="44" rx="11" fill="url(#embuddyGrad)"/>
  <!-- Embedding "constellation": nodes connected by edges, projected to a plane -->
  <g stroke="#ffffff" stroke-width="1.6" stroke-opacity="0.75">
    <line x1="14" y1="16" x2="24" y2="12"/>
    <line x1="24" y1="12" x2="34" y2="18"/>
    <line x1="14" y1="16" x2="18" y2="30"/>
    <line x1="18" y1="30" x2="30" y2="34"/>
    <line x1="34" y1="18" x2="30" y2="34"/>
    <line x1="24" y1="12" x2="18" y2="30"/>
  </g>
  <g fill="#ffffff">
    <circle cx="14" cy="16" r="3.4"/>
    <circle cx="24" cy="12" r="3.4"/>
    <circle cx="34" cy="18" r="3.4"/>
    <circle cx="18" cy="30" r="3.4"/>
    <circle cx="30" cy="34" r="3.4"/>
  </g>
</svg>
